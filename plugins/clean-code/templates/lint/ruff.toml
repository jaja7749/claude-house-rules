# Hard numbers referenced by CLAUDE.md (Python). Change them here, not there.
# Exceptions need a reason: # noqa: <rule>  # why

line-length = 120
extend-exclude = [".tmp", ".venv", "venv", "build", "dist"]

[lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "B",             # bugbear: common logic traps
  "C90",           # complexity
  "N",             # naming
  "PL",            # pylint: parameter, branch and statement counts, magic numbers
  "BLE",           # no swallowed errors
  "RET",           # consistent returns
  "SIM",           # simplifiable code
]
ignore = [
  "PLR2004",       # too noisy in tests; production code relies on review
]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
# Targets (40 lines / 4 params / 3 levels) live in CLAUDE.md; these are the ceilings.
max-args = 6
max-branches = 10
max-statements = 60         # ruff counts statements, not lines
max-returns = 4
max-nested-blocks = 4

[lint.per-file-ignores]
"tests/**" = ["PLR0913", "PLR0915"]
